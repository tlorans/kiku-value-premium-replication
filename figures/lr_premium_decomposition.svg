<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <text x="300" y="30" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Kiku (2006) – Long-run risk component of expected returns</text>
  <!-- Axes -->
  <line x1="80" y1="50" x2="80" y2="340" stroke="black" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="550" y2="340" stroke="black" stroke-width="1.5"/>
  <!-- Y ticks -->
  <text x="70" y="345" font-family="sans-serif" font-size="11" text-anchor="end">0</text>
  <text x="70" y="280" font-family="sans-serif" font-size="11" text-anchor="end">2</text>
  <text x="70" y="215" font-family="sans-serif" font-size="11" text-anchor="end">4</text>
  <text x="70" y="150" font-family="sans-serif" font-size="11" text-anchor="end">6</text>
  <text x="70" y="85" font-family="sans-serif" font-size="11" text-anchor="end">8</text>
  <text x="25" y="200" font-family="sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 25 200)">Long-run risk premium (%)</text>
  <!-- Bars -->
  <!-- Growth 1.8% -> height = 1.8/8 * 290 ≈ 65 -->
  <rect x="120" y="275" width="80" height="65" fill="#4682B4"/>
  <text x="160" y="360" font-family="sans-serif" font-size="13" text-anchor="middle">Growth</text>
  <text x="160" y="268" font-family="sans-serif" font-size="12" text-anchor="middle">1.8%</text>
  <!-- Value 6.5% -> height ≈ 236 -->
  <rect x="260" y="104" width="80" height="236" fill="#8B0000"/>
  <text x="300" y="360" font-family="sans-serif" font-size="13" text-anchor="middle">Value</text>
  <text x="300" y="97" font-family="sans-serif" font-size="12" text-anchor="middle">6.5%</text>
  <!-- Market 2.4% -> height ≈ 87 -->
  <rect x="400" y="253" width="80" height="87" fill="#808080"/>
  <text x="440" y="360" font-family="sans-serif" font-size="13" text-anchor="middle">Market</text>
  <text x="440" y="246" font-family="sans-serif" font-size="12" text-anchor="middle">2.4%</text>
  <text x="300" y="390" font-family="sans-serif" font-size="11" text-anchor="middle">Value–Growth spread ≈ 4.7 % (paper attributes ~85 % of the 5.3 % premium to long-run risks)</text>
</svg>
