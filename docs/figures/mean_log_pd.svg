<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340">
  <rect width="520" height="340" fill="white"/>
  <text x="260" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">Mean log(P/D) ranking (numerical stationary distribution)</text>
  <line x1="70" y1="50" x2="70" y2="280" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="280" x2="480" y2="280" stroke="#333" stroke-width="1.5"/>
  <!-- y from 2.5 to 4.0 -->
  <text x="60" y="285" text-anchor="end" font-size="11" fill="#555">2.5</text>
  <text x="60" y="203" text-anchor="end" font-size="11" fill="#555">3.0</text>
  <text x="60" y="122" text-anchor="end" font-size="11" fill="#555">3.5</text>
  <text x="60" y="55" text-anchor="end" font-size="11" fill="#555">4.0</text>
  <text x="18" y="170" transform="rotate(-90 18 170)" text-anchor="middle" font-size="12" fill="#333">Mean log(P/D)</text>
  <!-- Paper targets: Growth 3.65, Value 3.10, Market 3.24 -->
  <!-- map 2.5→280, 4.0→50 (230 px for 1.5 units → 153.3 px per unit) -->
  <!-- Growth 3.65: (3.65-2.5)*153.33 ≈ 176 → y = 280-176 = 104 -->
  <rect x="110" y="104" width="70" height="176" fill="#4682b4"/>
  <text x="145" y="300" text-anchor="middle" font-size="13">Growth</text>
  <text x="145" y="96" text-anchor="middle" font-size="12">3.65</text>
  <!-- Value 3.10: (3.10-2.5)*153.33 ≈ 92 → y = 280-92 = 188 -->
  <rect x="220" y="188" width="70" height="92" fill="#8b0000"/>
  <text x="255" y="300" text-anchor="middle" font-size="13">Value</text>
  <text x="255" y="180" text-anchor="middle" font-size="12">3.10</text>
  <!-- Market 3.24: (3.24-2.5)*153.33 ≈ 113 → y = 280-113 = 167 -->
  <rect x="330" y="167" width="70" height="113" fill="#708090"/>
  <text x="365" y="300" text-anchor="middle" font-size="13">Market</text>
  <text x="365" y="159" text-anchor="middle" font-size="12">3.24</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#555">Paper Table VII targets (value firms have lower PD because of higher long-run risk)</text>
</svg>
