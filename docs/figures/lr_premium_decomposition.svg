<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340">
  <rect width="520" height="340" fill="white"/>
  <text x="260" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">Long-run risk component of expected returns (Kiku 2006)</text>
  <!-- y-axis -->
  <line x1="70" y1="50" x2="70" y2="280" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="280" x2="480" y2="280" stroke="#333" stroke-width="1.5"/>
  <!-- y ticks -->
  <text x="60" y="285" text-anchor="end" font-size="11" fill="#555">0</text>
  <text x="60" y="230" text-anchor="end" font-size="11" fill="#555">2</text>
  <text x="60" y="175" text-anchor="end" font-size="11" fill="#555">4</text>
  <text x="60" y="120" text-anchor="end" font-size="11" fill="#555">6</text>
  <text x="60" y="65" text-anchor="end" font-size="11" fill="#555">8</text>
  <text x="20" y="170" transform="rotate(-90 20 170)" text-anchor="middle" font-size="12" fill="#333">Annual premium (%)</text>
  <!-- bars: Growth ~1.8, Value ~6.5, Market ~2.4  (illustrative of analytical output) -->
  <!-- scale: 0-8 maps to y=280 to y=50 (230 px) -->
  <rect x="110" y="228" width="70" height="52" fill="#4682b4"/>
  <text x="145" y="300" text-anchor="middle" font-size="13">Growth</text>
  <text x="145" y="220" text-anchor="middle" font-size="12" fill="#333">1.8%</text>
  <rect x="220" y="93" width="70" height="187" fill="#8b0000"/>
  <text x="255" y="300" text-anchor="middle" font-size="13">Value</text>
  <text x="255" y="85" text-anchor="middle" font-size="12" fill="#333">6.5%</text>
  <rect x="330" y="211" width="70" height="69" fill="#708090"/>
  <text x="365" y="300" text-anchor="middle" font-size="13">Market</text>
  <text x="365" y="203" text-anchor="middle" font-size="12" fill="#333">2.4%</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#555">Value–Growth spread ≈ 4.7% (long-run risk channel)</text>
</svg>
