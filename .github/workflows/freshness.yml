name: Freshness (full re-execute)

# Deletes the freeze cache and re-executes every page from scratch.
# Failure or drift here means the committed frozen outputs no longer
# match what the code produces. Never deploys.

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reexecute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install environment
        run: uv sync --group docs --extra fast --extra dev --extra data

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.29"

      - name: Full re-execute (no freeze)
        run: |
          rm -rf site/_freeze
          uv run quarto render site
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python

      - name: Package tests
        run: uv run pytest -q
