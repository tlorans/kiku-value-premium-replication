name: Tests

# Runs the package test suite on every push and pull request. Without
# this the suite only runs inside the weekly freshness job, so a broken
# test could sit on main until Monday.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install environment
        run: uv sync --extra dev --extra data

      - name: Run tests
        run: uv run pytest -q
