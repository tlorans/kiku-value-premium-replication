[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrrcs"
version = "0.5.0"
description = "General-equilibrium long-run risks: asset prices and risk premia."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Replication Team (Grok, Lucas, Harper, Benjamin)"}
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.7",
    "pandas>=2.2",
    "tidyfinance>=0.5.0",
]

[project.optional-dependencies]
fast = ["numba>=0.56"]
data = [
    "matplotlib",
    "pyarrow",
    "polars",
    "plotnine",
    "great-tables>=0.24.0",
]
dev = ["pytest", "matplotlib", "numba>=0.56"]

[dependency-groups]
docs = [
    "ipykernel",
    "jupyter-cache",
    "nbformat",
    "nbclient",
    "matplotlib",
    "plotnine",
    "polars",
    "pyarrow",
    "pyyaml",
    "great-tables>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not wrds"]
markers = [
    "wrds: live WRDS reconstruction (needs repo-root .env)",
]

[tool.setuptools.packages.find]
where = ["src"]
