[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geap"
version = "1.3.0"
description = "General-equilibrium asset pricing models in Python."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Thomas Lorans", email = "thomaslorans@gmail.com"}
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.7",
    "pandas>=2.2",
    "tidyfinance>=0.5.0",
]

[project.optional-dependencies]
fast = ["numba>=0.56"]
data = [
    "matplotlib",
    "pyarrow",
    "polars",
    "plotnine",
    "great-tables>=0.24.0",
]
# Enough to run the whole suite: pyyaml and polars are imported by the
# site lint and the backend round-trip tests.
dev = ["pytest", "matplotlib", "numba>=0.56", "pyyaml", "polars"]

[dependency-groups]
docs = [
    "ipykernel",
    "jupyter-cache",
    "nbformat",
    "nbclient",
    "matplotlib",
    "plotnine",
    "polars",
    "pyarrow",
    "pyyaml",
    "great-tables>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not wrds"]
markers = [
    "wrds: live WRDS reconstruction (needs repo-root .env)",
]

[tool.setuptools.packages.find]
where = ["src"]
