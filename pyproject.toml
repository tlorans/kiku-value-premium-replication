[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiku-value-premium"
version = "0.1.0"
description = "Python package to replicate Dana Kiku (2006) 'Is the Value Premium a Puzzle?' long-run risks model with Epstein-Zin preferences"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Replication Team (Grok, Lucas, Harper, Benjamin)"}
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
