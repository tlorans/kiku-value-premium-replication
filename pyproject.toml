[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiku-value-premium"
version = "0.3.0"
description = "Python package to replicate Dana Kiku (2006) 'Is the Value Premium a Puzzle?' long-run risks model with Epstein-Zin preferences"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Replication Team (Grok, Lucas, Harper, Benjamin)"}
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
]

[project.optional-dependencies]
fast = ["numba>=0.56"]
data = ["wrds", "python-dotenv", "matplotlib", "pyarrow"]
dev = ["pytest", "matplotlib", "numba>=0.56"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not wrds"]
markers = [
    "wrds: live WRDS reconstruction (needs repo-root .env)",
]

[tool.setuptools.packages.find]
where = ["src"]
